<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitação de Provisionamento FinOps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
    <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --muted: #8b949e;
      --text: #e6edf3;
      --accent: #4ade80;
      --danger: #f43f5e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(120% 120% at 10% 20%, rgba(74,222,128,0.12), transparent), var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    .container {
      width: min(1200px, 100%);
    }
    .layout-row { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
    .filters-col { flex:0 0 280px; }
    .list-col { flex:1 1 0; min-width:320px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      letter-spacing: -0.02em;
    }
    .subtitle { color: var(--muted); margin-top: 4px; font-size: 14px; }
    .card {
      background: linear-gradient(145deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    label {
      display: block;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 4px;
      color: #cdd6e0;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 14px;
    }
    select option { background: #0f1621; color: #e6edf3; }
    select option:disabled { color: var(--muted); }
    select option { background: #0f1621; color: #e6edf3; }
    select option:disabled { color: var(--muted); }
    textarea { resize: vertical; min-height: 80px; }
    .full { grid-column: 1 / -1; }
    td { vertical-align: middle; }
    thead th { position: sticky; top: 0; background: #111821; z-index: 1; }
    tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
    tr:hover { background: rgba(255,255,255,0.04); }
    .actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
      margin-top: 8px;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #0b0f14;
      box-shadow: 0 10px 30px rgba(34,197,94,0.35);
    }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
    }
    .status.success { background: rgba(74,222,128,0.12); color: #bbf7d0; border: 1px solid rgba(74,222,128,0.3); }
    .status.error { background: rgba(244,63,94,0.12); color: #fecdd3; border: 1px solid rgba(244,63,94,0.3); }
    .toast-container { position: fixed; top: 16px; right: 16px; display: flex; flex-direction: column; gap: 10px; z-index: 1100; }
    .toast { padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.08); color: #e5e7eb; box-shadow: 0 12px 30px rgba(0,0,0,0.35); min-width: 240px; }
    .toast.success { border-color: rgba(34,197,94,0.35); background: rgba(34,197,94,0.15); color: #c8facc; }
    .toast.error { border-color: rgba(244,63,94,0.35); background: rgba(244,63,94,0.15); color: #fecdd3; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .chip::before { font-size: 12px; }
    .chip.pendente { background: rgba(250,204,21,0.12); color: #e9d12c; border-color: rgba(250,204,21,0.25); }
    .chip.pendente::before { content: "⏰"; }
    .chip.aprovado { background: rgba(74,222,128,0.12); color: #80f0a2; border-color: rgba(74,222,128,0.25); }
    .chip.aprovado::before { content: "✔︎"; }
    .chip.expirado { background: rgba(248,113,113,0.12); color: #f88b8b; border-color: rgba(248,113,113,0.25); }
    .chip.expirado::before { content: "⛔"; }
    .chip.removido { background: rgba(148,163,184,0.12); color: #c2cbd6; border-color: rgba(148,163,184,0.25); }
    .chip.removido::before { content: "✖︎"; }
    .actions-row { display:grid; grid-template-columns: repeat(2, minmax(64px, 1fr)); gap:6px; align-items:start; }
    .actions-row button { padding: 6px 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: var(--text); font-size:11px; }
    .sla-btn { padding:6px 10px; border-radius:12px; border:1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); color: var(--text); font-size:12px; cursor:pointer; min-width:70px; text-align:center; }
    .sla-btn.soon { border-color: rgba(250,204,21,0.35); color: #facc15; }
    .sla-btn.late { border-color: rgba(248,113,113,0.35); color: #f87171; }
    .sla-btn.far { border-color: rgba(148,163,184,0.25); color: #cbd5e1; }
    .id-link { color: #8ab4ff; background:none; border:none; padding:0; cursor:pointer; font-weight:700; }
    .id-link:hover { text-decoration: underline; }
    .btn-approve { background: rgba(34,197,94,0.12); border-color: rgba(34,197,94,0.25); color: #c8facc; }
    .btn-danger { background: rgba(244,63,94,0.12); border-color: rgba(244,63,94,0.25); color: #fecdd3; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 1000; }
    .modal { background: #0f141c; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; max-width: 560px; width: 100%; box-shadow: 0 24px 60px rgba(0,0,0,0.65); }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-weight: 700; letter-spacing: -0.01em; }
    .modal-body { padding: 16px 20px 20px 20px; color: #e5e7eb; display: grid; gap: 10px; }
    .modal-close { background: none; border: none; color: #e5e7eb; font-size: 18px; cursor: pointer; }
    .detail-item { padding: 10px 12px; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; background: rgba(255,255,255,0.03); }
    .detail-label { font-weight: 700; color: #cbd5e1; font-size: 13px; display:block; margin-bottom:4px; text-transform: uppercase; letter-spacing: 0.02em; }
    .detail-value { color: #e2e8f0; white-space: pre-wrap; }
    .summary-grid { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
    .summary-card { background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:12px 14px; min-width:140px; box-shadow: 0 12px 30px rgba(0,0,0,0.25); }
    .summary-card:nth-child(1) { border-color: rgba(250,204,21,0.35); }
    .summary-card:nth-child(2) { border-color: rgba(56,189,248,0.35); }
    .summary-card:nth-child(3) { border-color: rgba(248,113,113,0.35); }
    .summary-card:nth-child(4) { border-color: rgba(74,222,128,0.35); }
    .summary-title { color:#cbd5e1; font-size:12px; letter-spacing:0.02em; text-transform: uppercase; margin-bottom:4px; }
    .summary-value { font-size:20px; font-weight:700; color:#e5e7eb; }
    .filter-stack { display:flex; flex-direction:column; gap:10px; }
    .pager { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:12px; flex-wrap:wrap; }
    @media (max-width: 600px) {
      body { padding: 16px 12px; }
      .actions { justify-content: stretch; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="title">Registro de Provisionamento</div>
        <div class="subtitle">Controle FinOps local • sem automação na nuvem</div>
      </div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <div id="user-info" style="color:var(--muted);font-size:13px;"></div>
        <button type="button" class="btn-secondary" id="login-btn">Entrar</button>
        <button type="button" class="btn-secondary" id="logout-btn" style="display:none;">Sair</button>
      </div>
    </header>

    <div id="login-panel" class="card" style="margin-bottom:16px;">
      <div style="font-weight:700;margin-bottom:8px;">Entrar</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <input id="login-username" placeholder="usuario ou admin">
        <input id="login-password" type="password" placeholder="senha">
        <button type="button" class="btn-primary" id="do-login">Login</button>
      </div>
      <div id="login-status" class="status" style="display:none;"></div>
    </div>

    <div id="protected-section" style="display:none;">
      <div class="layout-row">
        <div class="filters-col" id="side-stack">
          <div class="card" id="form-card">
            <form id="request-form">
              <div>
                <label for="requester">Solicitante *</label>
                <input id="requester" name="requester" required placeholder="nome@empresa.com">
              </div>
              <div>
                <label for="service_type">Serviço *</label>
                <select id="service_type" name="service_type" required></select>
              </div>
              <div>
                <label for="aws_account">Conta AWS *</label>
                <select id="aws_account" name="aws_account" required></select>
              </div>
              <div>
                <label for="region">Região *</label>
                <select id="region" name="region" required></select>
              </div>
              <div>
                <label for="expires_at">Data de remoção *</label>
                <input id="expires_at" name="expires_at" type="date" required>
              </div>
              <div>
                <label for="retention_days">Tempo de uso (dias)</label>
                <input id="retention_days" name="retention_days" type="number" min="1" placeholder="ex.: 30">
              </div>
              <div class="full">
                <label for="params">Detalhes do recurso (texto livre)</label>
                <textarea id="params" name="params" placeholder="Ex.: Snapshot do volume vol-123 tamanho 200GB, encrypted com KMS X."></textarea>
              </div>
              <div class="full">
                <label for="tags">Tags principais (texto livre)</label>
                <textarea id="tags" name="tags" placeholder="Owner=nome@empresa.com; CostCenter=CC123; Project=ProjetoX; ExpiresAt=2025-02-15"></textarea>
              </div>
              <div class="actions">
                <button type="button" class="btn-secondary" id="reset-btn">Limpar</button>
                <button type="submit" class="btn-primary">Enviar solicitação</button>
              </div>
              <div id="status" class="status" style="display:none;"></div>
            </form>
          </div>

          <div class="card" id="filters-card" style="margin-top:16px;">
            <div style="font-weight:700;margin-bottom:8px;">Filtros e busca</div>
            <div class="filter-stack">
              <input id="viewer" placeholder="Seu nome ou e-mail para filtrar" style="padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:var(--text);">
              <input id="filter-id" placeholder="ID" style="padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:var(--text);width:100%;">
              <input id="filter-account" placeholder="Conta" style="padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:var(--text);width:100%;">
              <select id="filter-status" style="padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:var(--text);">
                <option value="">Status (todos)</option>
                <option value="pendente">Pendente</option>
                <option value="aprovado">Aprovado</option>
                <option value="expirado">Expirado</option>
                <option value="removido">Removido</option>
              </select>
              <select id="filter-quick-exp" style="padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:var(--text);">
                <option value="">Expira (todos)</option>
                <option value="7">Expira em até 7 dias</option>
                <option value="30">Expira em até 30 dias</option>
              </select>
              <input id="filter-exp-before" type="date" style="padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:var(--text);" title="Expira até">
              <button type="button" class="btn-secondary" id="reload-btn" style="padding:10px 12px; width:100%;">Recarregar</button>
            </div>
          </div>
        </div>

        <div class="list-col">
          <div class="card" id="list-card">
            <div id="summary" class="summary-grid" style="display:none;"></div>
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
              <div>
                <div id="requests-title" style="font-weight:700;">Minhas solicitações</div>
                <div style="color:var(--muted);font-size:13px;">Histórico e aprovação</div>
              </div>
            </div>
            <div id="list-status" class="status" style="display:none;"></div>
            <div style="overflow-x:hidden; width:100%;">
              <table id="requests-table" style="width:100%; border-collapse:collapse; font-size:14px; table-layout:auto;">
                <thead>
                  <tr style="text-align:left; color:var(--muted); border-bottom:1px solid rgba(255,255,255,0.08);">
                    <th style="width:12%;">ID</th>
                    <th style="width:14%;">Solicitante</th>
                    <th style="width:12%;">Serviço</th>
                    <th style="width:13%;">Conta</th>
                    <th style="width:10%;">Região</th>
                    <th style="width:10%;">Status</th>
                    <th style="width:12%;">Expira em</th>
                    <th style="width:8%;">Ações</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
            <div id="pager" class="pager"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
  </div>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="detail-title">Detalhes da solicitação</div>
          <div style="margin-top:6px;"><span class="chip" id="detail-status-chip"></span></div>
        </div>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="detail-item"><span class="detail-label">Params</span> <span class="detail-value" id="detail-params">-</span></div>
        <div class="detail-item"><span class="detail-label">Tags</span> <span class="detail-value" id="detail-tags">-</span></div>
        <div class="detail-item"><span class="detail-label">Custo estimado</span> <span class="detail-value" id="detail-cost">-</span></div>
        <div class="detail-item"><span class="detail-label">Recurso</span> <span class="detail-value" id="detail-resource">-</span></div>
      </div>
      <div id="modal-actions" class="modal-footer" style="padding:14px 20px; border-top:1px solid rgba(255,255,255,0.08); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('request-form');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('reset-btn');
    const reloadBtn = document.getElementById('reload-btn');
    const listStatus = document.getElementById('list-status');
    const tableBody = document.querySelector('#requests-table tbody');
    const viewerInput = document.getElementById('viewer');
    const filterId = document.getElementById('filter-id');
    const filterAccount = document.getElementById('filter-account');
    const filterStatus = document.getElementById('filter-status');
    const filterExpBefore = document.getElementById('filter-exp-before');
    const filterQuickExp = document.getElementById('filter-quick-exp');
    let serviceTypeSelect = document.getElementById('service_type');
    let accountSelect = document.getElementById('aws_account');
    let regionSelect = document.getElementById('region');
    const formCard = document.getElementById('form-card');
    const filtersCard = document.getElementById('filters-card');
    const formNotice = document.createElement('div');
    formNotice.className = 'status';
    formNotice.style.display = 'none';
    formNotice.style.marginTop = '8px';
    formCard.appendChild(formNotice);
    const loginPanel = document.getElementById('login-panel');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const loginUsername = document.getElementById('login-username');
    const loginPassword = document.getElementById('login-password');
    const doLoginBtn = document.getElementById('do-login');
    const loginStatus = document.getElementById('login-status');
    const userInfo = document.getElementById('user-info');
    const protectedSection = document.getElementById('protected-section');
    const sideStack = document.getElementById('side-stack');
    const userPanel = document.createElement('div');
    userPanel.className = 'card';
    userPanel.style.marginTop = '12px';
    userPanel.style.display = 'none';
    userPanel.innerHTML = `
      <div style="font-weight:700;margin-bottom:8px;">Criar usuário (admin)</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <input id="new-username" placeholder="username">
        <input id="new-password" type="password" placeholder="senha">
        <select id="new-role">
          <option value="user">Solicitante</option>
          <option value="admin">Admin</option>
        </select>
        <input id="new-display" placeholder="Nome para exibir">
        <button type="button" class="btn-primary" id="save-user-btn">Salvar</button>
        <button type="button" class="btn-secondary" id="import-btn">Importar CSV</button>
      </div>
      <div id="user-status" class="status" style="display:none;"></div>
    `;
    sideStack.appendChild(userPanel);
    const saveUserBtn = userPanel.querySelector('#save-user-btn');
    const newUsername = userPanel.querySelector('#new-username');
    const newPassword = userPanel.querySelector('#new-password');
    const newRole = userPanel.querySelector('#new-role');
    const newDisplay = userPanel.querySelector('#new-display');
    const userStatus = userPanel.querySelector('#user-status');
    const importBtn = userPanel.querySelector('#import-btn');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalClose = document.getElementById('modal-close');
    const detailParams = document.getElementById('detail-params');
    const detailTags = document.getElementById('detail-tags');
    const detailCost = document.getElementById('detail-cost');
    const detailResource = document.getElementById('detail-resource');
    const summaryContainer = document.getElementById('summary');
    const importInput = document.createElement('input');
    importInput.type = 'file';
    importInput.accept = '.csv';
    importInput.style.display = 'none';
    document.body.appendChild(importInput);

    let requesterFilter = '';
    let authToken = localStorage.getItem('access_token') || null;
    let refreshToken = localStorage.getItem('refresh_token') || null;
    let currentUser = localStorage.getItem('user') ? JSON.parse(localStorage.getItem('user')) : null;
    function showStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = 'status ' + type;
      statusEl.style.display = 'block';
    }

    function showListStatus(message, type) {
      listStatus.textContent = message;
      listStatus.className = 'status ' + type;
      listStatus.style.display = 'block';
    }

    function toast(message, type='success', duration=3000) {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      }, duration);
    }

    function safeAttr(value) {
      if (!value) return '';
      return String(value).replace(/"/g, '&quot;');
    }

    function daysToExpiry(dateStr) {
      if (!dateStr) return null;
      const today = new Date();
      today.setHours(0,0,0,0);
      const target = new Date(dateStr);
      target.setHours(0,0,0,0);
      const diffMs = target - today;
      return Math.round(diffMs / (1000 * 60 * 60 * 24));
    }

    function buildDataAttrs(item) {
      return `data-id="${item.id}"
        data-status="${item.status}"
        data-idfull="${item.id}"
        data-requester="${safeAttr(item.requester)}"
        data-service="${safeAttr(item.service_type)}"
        data-account="${safeAttr(item.aws_account || '-')}"
        data-region="${safeAttr(item.region || '-')}"
        data-exp="${safeAttr(item.expires_at)}"
        data-params="${safeAttr(item.params || '')}"
        data-tags="${safeAttr(item.tags || '')}"
        data-cost="${safeAttr(item.estimated_cost || '')}"
        data-resource="${safeAttr(item.resource_id || '')}"`;
    }

    async function loadMeta() {
      const defaultsServices = ['ebs_snapshot','ec2','elb','s3','rds_snapshot','outro'];
      const defaultsRegions = ['sa-east-1','us-east-1'];
      try {
        const data = await withAuth(async (token) => {
          const res = await fetch('/api/meta', { headers: token ? { 'X-Auth-Token': token } : {} });
          if (!res.ok) throw new Error('Erro ao carregar metadados');
          return res.json();
        });
        populateSelect(serviceTypeSelect, (data.allowed_services && data.allowed_services.length ? data.allowed_services : defaultsServices), 'Selecione');
        populateSelect(regionSelect, (data.allowed_regions && data.allowed_regions.length ? data.allowed_regions : defaultsRegions), 'Selecione');
        if (data.allowed_accounts && data.allowed_accounts.length) {
          populateSelect(accountSelect, data.allowed_accounts, 'Selecione');
        } else {
          const input = document.createElement('input');
          input.id = 'aws_account';
          input.name = 'aws_account';
          input.required = true;
          input.placeholder = 'Conta AWS';
          input.style.padding = '10px 12px';
          input.style.borderRadius = '10px';
          input.style.border = '1px solid rgba(255,255,255,0.1)';
          input.style.background = 'rgba(255,255,255,0.04)';
          input.style.color = 'var(--text)';
          accountSelect.replaceWith(input);
          accountSelect = input;
        }
      } catch {
        // fallback silencioso com defaults
        populateSelect(serviceTypeSelect, defaultsServices, 'Selecione');
        populateSelect(regionSelect, defaultsRegions, 'Selecione');
        const input = document.createElement('input');
        input.id = 'aws_account';
        input.name = 'aws_account';
        input.required = true;
        input.placeholder = 'Conta AWS';
        input.style.padding = '10px 12px';
        input.style.borderRadius = '10px';
        input.style.border = '1px solid rgba(255,255,255,0.1)';
        input.style.background = 'rgba(255,255,255,0.04)';
        input.style.color = 'var(--text)';
        accountSelect.replaceWith(input);
        accountSelect = input;
      }
    }

    function populateSelect(selectEl, options, placeholder) {
      selectEl.innerHTML = '';
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = placeholder;
      opt.disabled = true;
      opt.selected = true;
      selectEl.appendChild(opt);
      options.forEach((v) => {
        const o = document.createElement('option');
        o.value = v;
        o.textContent = v;
        selectEl.appendChild(o);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.style.display = 'none';

      if (!authToken) {
        showStatus('Faça login para enviar solicitação.', 'error');
        return;
      }

      const payload = {
        service_type: form.service_type.value,
        aws_account: form.aws_account.value,
        region: form.region.value,
        expires_at: form.expires_at.value,
        retention_days: form.retention_days.value ? Number(form.retention_days.value) : null,
        params: form.params.value || null,
        tags: form.tags.value || null
      };

      try {
        await withAuth(async (token) => {
          const res = await fetch('/api/requests', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Auth-Token': token },
            body: JSON.stringify(payload)
          });
          if (!res.ok) {
            let errMsg = 'Erro ao criar solicitação';
            try {
              const data = await res.json();
              errMsg = data.detail || JSON.stringify(data);
            } catch {
              const text = await res.text();
              if (text) errMsg = text;
            }
            throw new Error(errMsg);
          }
          const data = await res.json();
          toast('Solicitação criada. ID: ' + data.id, 'success');
          showStatus('Solicitação enviada para aprovação.', 'success');
          form.reset();
        });
      } catch (err) {
        const msg = err && err.message ? err.message : 'Erro ao criar solicitação';
        showStatus(msg, 'error');
        toast(msg, 'error');
      }
    });

    resetBtn.addEventListener('click', () => {
      form.reset();
      statusEl.style.display = 'none';
    });

    reloadBtn.addEventListener('click', () => loadRequests(1));
    filterStatus.addEventListener('change', () => loadRequests(1));
    filterExpBefore.addEventListener('change', () => {
      filterQuickExp.value = '';
      loadRequests(1);
    });
    filterQuickExp.addEventListener('change', () => {
      if (filterQuickExp.value) filterExpBefore.value = '';
      loadRequests(1);
    });

    viewerInput.addEventListener('change', () => {
      requesterFilter = viewerInput.value.trim();
      loadRequests();
    });
    async function loadRequests(page = 1) {
      if (!authToken) {
        tableBody.innerHTML = '<tr><td colspan="8" style="padding:12px;color:var(--muted);">Faça login para ver suas solicitações.</td></tr>';
        return;
      }
      listStatus.style.display = 'none';
      tableBody.innerHTML = '<tr><td colspan="8" style="padding:12px;color:var(--muted);">Carregando...</td></tr>';
      try {
        const qs = new URLSearchParams();
        qs.set('page', page);
        qs.set('page_size', 10);
        if (requesterFilter) qs.set('requester', requesterFilter);
        if (filterStatus.value) qs.set('status', filterStatus.value);
        if (filterId.value) qs.set('id', filterId.value.trim());
        if (filterAccount.value) qs.set('aws_account', filterAccount.value.trim());
        if (filterExpBefore.value) qs.set('expires_before', filterExpBefore.value);
        if (filterQuickExp.value) {
          const days = parseInt(filterQuickExp.value, 10);
          const d = new Date();
          d.setDate(d.getDate() + days);
          qs.set('expires_before', d.toISOString().slice(0,10));
        }
        const url = `/api/requests?${qs.toString()}`;
        const data = await withAuth(async (token) => {
          const res = await fetch(url, { headers: token ? { 'X-Auth-Token': token } : {} });
          if (!res.ok) throw new Error('Erro ao listar solicitações');
          return res.json();
        });
        const items = data.items || [];
        if (!items.length) {
          tableBody.innerHTML = '<tr><td colspan="8" style="padding:12px;color:var(--muted);">Nenhuma solicitação ainda.</td></tr>';
          return;
        }
        tableBody.innerHTML = '';
        items.forEach(item => {
          const tr = document.createElement('tr');
          tr.style.borderBottom = '1px solid rgba(255,255,255,0.06)';
          const isAdmin = currentUser && currentUser.role === 'admin';
          const statusChip = `<span class="chip ${item.status}">${item.status}</span>`;
          const dataAttrs = buildDataAttrs(item);
          const idLink = `<button class="id-link action open-modal" ${dataAttrs}>${item.id.slice(0,8)}</button>`;
          const days = daysToExpiry(item.expires_at);
          let slaLabel = '–';
          let slaClass = 'far';
          if (days !== null) {
            if (days < 0) { slaLabel = `${Math.abs(days)}d atraso`; slaClass = 'late'; }
            else if (days <= 7) { slaLabel = `${days}d`; slaClass = 'soon'; }
            else if (days <= 30) { slaLabel = `${days}d`; slaClass = 'far'; }
            else { slaLabel = '+30d'; slaClass = 'far'; }
          }
          const actionsCell = `<button class="sla-btn ${slaClass} action open-modal" ${dataAttrs}>${slaLabel}</button>`;
          tr.innerHTML = `
            <td style="padding:8px;">${idLink}</td>
            <td>${item.requester}</td>
            <td>${item.service_type}</td>
            <td>${item.aws_account || '-'}</td>
            <td>${item.region || '-'}</td>
            <td>${statusChip}</td>
            <td>${item.expires_at}</td>
            <td>${actionsCell}</td>
          `;
          tableBody.appendChild(tr);
        });
        attachActionHandlers();
        renderPagination(data.page, data.page_size, data.total);
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    async function loadSummary() {
      if (!authToken || !currentUser || currentUser.role !== 'admin') {
        summaryContainer.style.display = 'none';
        return;
      }
      try {
        const data = await withAuth(async (token) => {
          const res = await fetch('/api/requests/summary', { headers: { 'X-Auth-Token': token } });
          if (!res.ok) throw new Error('Erro ao carregar resumo');
          return res.json();
        });
        summaryContainer.style.display = 'flex';
        summaryContainer.innerHTML = `
          <div class="summary-card"><div class="summary-title">Expira até 7d</div><div class="summary-value">${data.expiring_7}</div></div>
          <div class="summary-card"><div class="summary-title">Expira até 30d</div><div class="summary-value">${data.expiring_30}</div></div>
          <div class="summary-card"><div class="summary-title">Expirados</div><div class="summary-value">${data.expired_unremoved}</div></div>
          <div class="summary-card"><div class="summary-title">Pendentes</div><div class="summary-value">${data.pending}</div></div>
        `;
      } catch (err) {
        summaryContainer.style.display = 'none';
      }
    }

    function renderPagination(page, pageSize, total) {
      const totalPages = Math.max(1, Math.ceil(total / pageSize));
      const pager = document.getElementById('pager');
      if (!pager) return;
      pager.innerHTML = '';
      const info = document.createElement('span');
      info.style.color = 'var(--muted)';
      info.textContent = `Página ${page} de ${totalPages} (${total} itens)`;
      const prev = document.createElement('button');
      prev.textContent = 'Anterior';
      prev.className = 'btn-secondary';
      prev.disabled = page <= 1;
      prev.onclick = () => loadRequests(page - 1);
      const next = document.createElement('button');
      next.textContent = 'Próxima';
      next.className = 'btn-secondary';
      next.disabled = page >= totalPages;
      next.onclick = () => loadRequests(page + 1);
      pager.appendChild(info);
      pager.appendChild(prev);
      pager.appendChild(next);
    }

    function attachActionHandlers() {
      document.querySelectorAll('.action.approve').forEach(btn => {
        btn.onclick = () => {
          if (confirm('Confirmar aprovação?')) updateStatus(btn.dataset.id, 'aprovado');
        };
      });
      document.querySelectorAll('.action.details').forEach(btn => {
        btn.onclick = () => {
          openDetail(btn);
        };
      });
      document.querySelectorAll('.action.open-modal').forEach(btn => {
        btn.onclick = () => openDetail(btn);
      });
      document.querySelectorAll('.action.delete').forEach(btn => {
        btn.onclick = () => {
          if (confirm('Remover definitivamente esta solicitação?')) {
            deleteRequest(btn.dataset.id);
          }
        };
      });
      document.querySelectorAll('.action.cancel').forEach(btn => {
        btn.onclick = () => {
          if (confirm('Cancelar e remover sua solicitação?')) {
            deleteRequest(btn.dataset.id);
          }
        };
      });
    }

    async function updateStatus(id, status) {
      try {
        await withAuth(async (token) => {
          const res = await fetch(`/api/requests/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'X-Auth-Token': token || '' },
            body: JSON.stringify({ status })
          });
          if (!res.ok) throw new Error('Falha ao atualizar status');
        });
        await loadRequests();
        toast('Status atualizado', 'success');
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    function openDetail(btn) {
      detailParams.textContent = btn.dataset.params || '-';
      detailTags.textContent = btn.dataset.tags || '-';
      detailCost.textContent = btn.dataset.cost || '-';
      detailResource.textContent = btn.dataset.resource || '-';
      const status = btn.dataset.status || '-';
      const idfull = btn.dataset.idfull || '-';
      const chip = document.getElementById('detail-status-chip');
      chip.className = `chip ${status}`;
      chip.textContent = status;
      document.getElementById('detail-title').textContent = `Solicitação ${idfull.slice(0,8)}`;

      const modalActions = document.getElementById('modal-actions');
      modalActions.innerHTML = '';
      const id = btn.dataset.id;
      const isAdmin = currentUser && currentUser.role === 'admin';
      if (isAdmin) {
        const approve = document.createElement('button');
        approve.className = 'btn-primary';
        approve.textContent = 'Aprovar';
        approve.onclick = () => updateStatus(id, 'aprovado');
        const remove = document.createElement('button');
        remove.className = 'btn-danger';
        remove.textContent = 'Remover';
        remove.onclick = () => {
          if (confirm('Remover definitivamente esta solicitação?')) deleteRequest(id);
        };
        modalActions.appendChild(approve);
        modalActions.appendChild(remove);
      } else {
        const cancel = document.createElement('button');
        cancel.className = 'btn-danger';
        cancel.textContent = 'Cancelar';
        cancel.onclick = () => {
          if (confirm('Cancelar e remover sua solicitação?')) deleteRequest(id);
        };
        modalActions.appendChild(cancel);
      }
      modalOverlay.style.display = 'flex';
    }

    async function deleteRequest(id) {
      try {
        await withAuth(async (token) => {
          const res = await fetch(`/api/requests/${id}`, { method: 'DELETE', headers: { 'X-Auth-Token': token || '' } });
          if (!res.ok) {
            const t = await res.text();
            throw new Error(t || 'Falha ao excluir');
          }
        });
        await loadRequests();
        toast('Solicitação removida da lista', 'success');
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    async function createUser() {
      userStatus.style.display = 'none';
      try {
        await withAuth(async (token) => {
          const res = await fetch('/api/auth/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Auth-Token': token || '' },
            body: JSON.stringify({
              username: newUsername.value,
              password: newPassword.value,
              role: newRole.value,
              display_name: newDisplay.value
            })
          });
          if (!res.ok) {
            const t = await res.text();
            throw new Error(t || 'Erro ao criar usuário');
          }
        });
        toast('Usuário criado', 'success');
        newUsername.value = '';
        newPassword.value = '';
        newDisplay.value = '';
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    saveUserBtn.addEventListener('click', createUser);
    importBtn.addEventListener('click', () => {
      importInput.click();
    });

    importInput.addEventListener('change', async () => {
      const file = importInput.files[0];
      if (!file) return;
      userStatus.style.display = 'none';
      if (!file.name.endsWith('.csv')) {
        userStatus.textContent = 'Envie um arquivo CSV';
        userStatus.className = 'status error';
        userStatus.style.display = 'block';
        importInput.value = '';
        return;
      }
      try {
        await withAuth(async (token) => {
          const formData = new FormData();
          formData.append('file', file);
          const res = await fetch('/api/imports/csv', {
            method: 'POST',
            headers: { 'X-Auth-Token': token },
            body: formData
          });
          if (!res.ok) {
            const t = await res.text();
            throw new Error(t || 'Erro ao importar CSV');
          }
          const data = await res.json();
          userStatus.textContent = `Importado: ${data.count} solicitações.`;
          userStatus.className = 'status success';
          userStatus.style.display = 'block';
          loadRequests(1);
        });
      } catch (err) {
        userStatus.textContent = err.message;
        userStatus.className = 'status error';
        userStatus.style.display = 'block';
      } finally {
        importInput.value = '';
      }
    });

    requesterFilter = '';
    updateAuthUI();
    loadRequests();
    loadMeta();
    loadSummary();

    function clearSession() {
      authToken = null;
      refreshToken = null;
      currentUser = null;
      localStorage.removeItem('access_token');
      localStorage.removeItem('refresh_token');
      localStorage.removeItem('user');
      tableBody.innerHTML = '<tr><td colspan="8" style="padding:12px;color:var(--muted);">Faça login para ver suas solicitações.</td></tr>';
      statusEl.style.display = 'none';
      listStatus.style.display = 'none';
    }

    loginBtn.addEventListener('click', () => {
      clearSession();
      updateAuthUI();
      summaryContainer.style.display = 'none';
    });

    logoutBtn.addEventListener('click', () => {
      clearSession();
      updateAuthUI();
      loadSummary();
    });
    async function handleLogin() {
      loginStatus.style.display = 'none';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: loginUsername.value, password: loginPassword.value })
        });
        if (!res.ok) throw new Error('Credenciais inválidas');
        const data = await res.json();
        authToken = data.access_token;
        refreshToken = data.refresh_token;
        currentUser = data.user;
        localStorage.setItem('access_token', authToken);
        localStorage.setItem('refresh_token', refreshToken);
        localStorage.setItem('user', JSON.stringify(currentUser));
        loginPanel.style.display = 'none';
        updateAuthUI();
        loadRequests();
      } catch (err) {
        loginStatus.textContent = err.message;
        loginStatus.className = 'status error';
        loginStatus.style.display = 'block';
      }
    }

    doLoginBtn.addEventListener('click', handleLogin);
    loginPassword.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleLogin();
      }
    });
    loginUsername.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleLogin();
      }
    });

    function updateAuthUI() {
      if (currentUser) {
        userInfo.textContent = `${currentUser.display_name} (${currentUser.role})`;
        loginBtn.style.display = 'inline-block';
        loginBtn.textContent = 'Trocar usuário';
        logoutBtn.style.display = 'inline-block';
        protectedSection.style.display = 'block';
        loginPanel.style.display = 'none';
        if (currentUser.role === 'admin') {
          formCard.style.display = 'none';
          userPanel.style.display = 'block';
          document.querySelector('#requests-title').textContent = 'Todas as solicitações';
          filtersCard.style.display = 'block';
        } else {
          formCard.style.display = 'block';
          formCard.querySelector('form').style.display = 'grid';
          userPanel.style.display = 'none';
          document.querySelector('#requests-title').textContent = 'Minhas solicitações';
          filtersCard.style.display = 'none';
        }
      } else {
        userInfo.textContent = '';
        loginBtn.textContent = 'Entrar';
        loginBtn.style.display = 'inline-block';
        logoutBtn.style.display = 'none';
        protectedSection.style.display = 'none';
        loginPanel.style.display = 'block';
        formCard.style.display = 'block';
        formCard.querySelector('form').style.display = 'grid';
        userPanel.style.display = 'none';
        filtersCard.style.display = 'none';
        document.querySelector('#requests-title').textContent = 'Minhas solicitações';
      }
    }

    async function withAuth(fn) {
      if (!authToken && refreshToken) {
        const refreshed = await tryRefresh();
        if (!refreshed) throw new Error('Sessão expirada, faça login novamente.');
        authToken = localStorage.getItem('access_token');
      }
      if (!authToken) throw new Error('Faça login.');
      return fn(authToken);
    }

    async function tryRefresh() {
      if (!refreshToken) return false;
      const res = await fetch('/api/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: refreshToken })
      });
      if (!res.ok) return false;
      const data = await res.json();
      authToken = data.access_token;
      refreshToken = data.refresh_token;
      localStorage.setItem('access_token', authToken);
      localStorage.setItem('refresh_token', refreshToken);
      return true;
    }

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.style.display = 'none';
    });
    modalClose.addEventListener('click', () => {
      modalOverlay.style.display = 'none';
    });
  </script>
</body>
</html>
